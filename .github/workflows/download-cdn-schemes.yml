name: Download CDN marking schemes

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download discovered PDFs
        run: |
          mkdir -p /tmp/schemes
          cat > /tmp/urls.tsv <<'EOF'
          lc/biology/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/c5867fd3-dc74-4669-85d5-0b312796e18b.pdf
          lc/biology/2025/deferred-higher.pdf	https://blob-static.studyclix.ie/cms/media/fd349851-5373-459e-ac33-f67874222620.pdf
          lc/geography/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/fe9fb8d2-eb27-4839-b730-8584fcc0a122.pdf
          lc/geography/2025/deferred-higher.pdf	https://blob-static.studyclix.ie/cms/media/0a85a1e9-dec7-451a-952f-4c182faf20fb.pdf
          lc/chemistry/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/0f6495f1-67d6-4544-a1f9-80fb64c39949.pdf
          lc/technology/2026/higher.pdf	https://blob-static.studyclix.ie/cms/media/9bf9eb27-b5f8-4efe-8c22-5fc9d32d78ab.pdf
          lc/technology/2025/ordinary.pdf	https://blob-static.studyclix.ie/cms/media/f3997b13-445f-4842-bd1b-30395a29e51c.pdf
          lc/engineering/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/24136ab5-18fb-4f50-b468-d79a0513018b.pdf
          lc/english/2025/deferred-higher.pdf	https://blob-static.studyclix.ie/cms/media/cb562538-89e1-4488-8ed4-7c41728495c6.pdf
          lc/french/2026/higher.pdf	https://blob-static.studyclix.ie/cms/media/f7983fab-7b06-4390-8cd7-c4ebb190e7e3.pdf
          lc/computer-science/2026/ordinary.pdf	https://blob-static.studyclix.ie/cms/media/cc94b3cb-a106-4428-9c6c-1d349973f88a.pdf
          jc/english/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/29b130bd-00ea-46e2-9cdc-6c71dde29372.pdf
          jc/science/2025/common.pdf	https://blob-static.studyclix.ie/cms/media/bd38783c-56da-47d5-9077-4f4bfe2b0ecf.pdf
          jc/maths/2026/higher.pdf	https://blob-static.studyclix.ie/cms/media/09a083b2-c7f8-47c6-a0a4-835fd1332e47.pdf
          jc/applied-technology/2026/common.pdf	https://blob-static.studyclix.ie/cms/media/d30f3cf1-621b-49a3-baba-007e71ad326b.pdf
          jc/science/2023/common.pdf	https://blob-static.studyclix.ie/cms/media/3361f96f-1b58-46c8-a8a6-7e8e61545ab5.pdf
          lc/maths/2025/higher.pdf	https://blob-static.studyclix.ie/cms/media/6bfb21db-402f-4a77-8d9c-3521c302e040.pdf
          EOF
          while IFS=$'\t' read -r path url; do
            mkdir -p "/tmp/schemes/$(dirname "$path")"
            curl --fail --retry 5 --retry-delay 2 -L "$url" \
              -o "/tmp/schemes/$path"
          done < /tmp/urls.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: cdn-marking-schemes
          path: /tmp/schemes
