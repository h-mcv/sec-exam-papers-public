name: Probe StudyClix paper API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch papers page and scripts
        run: |
          mkdir -p /tmp/studyclix-js
          curl --fail --retry 3 --retry-delay 2 -L \
            https://www.studyclix.ie/papers -o /tmp/studyclix-papers.html
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/studyclix-papers.html |
            sed -E 's/^src="([^"]+)".*$/\1/' |
            while read -r script; do
              case "$script" in
                http*) url="$script" ;;
                /*) url="https://www.studyclix.ie$script" ;;
                *) url="https://www.studyclix.ie/$script" ;;
              esac
              curl --fail --retry 3 --retry-delay 1 -L "$url" \
                -o "/tmp/studyclix-js/$(basename "${script%%\?*}")" || true
            done
          grep -RohE 'https?[^"]+|/api/[A-Za-z0-9_/?=&.-]+' /tmp/studyclix-js |
            grep -Ei 'paper|exam|mark|api' | sort -u > /tmp/studyclix-endpoints.txt || true
          for endpoint in exams examYears mediaTypes subjects; do
            curl --retry 3 --retry-delay 1 -L \
              "https://bff.studyclix.ie/api/$endpoint" \
              -o "/tmp/studyclix-$endpoint.json" || true
            curl --retry 3 --retry-delay 1 -L \
              "https://studyclix-as-ie-api-live.azurewebsites.net/api/$endpoint" \
              -o "/tmp/studyclix-direct-$endpoint.json" || true
          done
          curl --fail --retry 3 --retry-delay 1 -L \
            'https://bff.studyclix.ie/api/exampapers?subject=1' \
            -o /tmp/studyclix-exampapers-1.json || true
          curl --retry 3 --retry-delay 1 -L \
            -H 'Origin: https://www.studyclix.ie' \
            -H 'Referer: https://www.studyclix.ie/' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'X-CSRF: 1' \
            'https://bff.studyclix.ie/api/exampapers?subject=1042581' \
            -o /tmp/studyclix-auth-exampapers.json || true
          for endpoint in \
            'exampapers?subject=1042581' \
            'subjects' \
            'examYears'; do
            safe=$(echo "$endpoint" | tr '?=&' '___')
            curl --retry 3 --retry-delay 1 -L \
              "https://www.studyclix.ie/api/$endpoint" \
              -o "/tmp/studyclix-same-$safe.json" || true
          done
          for page in \
            leaving-certificate/english \
            leaving-certificate/mathematics \
            junior-cycle/english \
            junior-cycle/mathematics; do
            safe=$(echo "$page" | tr / -)
            curl --fail --retry 3 --retry-delay 1 -L \
            "https://www.studyclix.ie/$page" \
              -o "/tmp/studyclix-page-$safe.html" || true
          done
          for query in \
            '"Leaving Certificate 2024 Marking Scheme Mathematics Higher Level"' \
            '"Junior Cycle 2024 Marking Scheme Mathematics Higher Level"'; do
            safe=$(echo "$query" | tr -cd '[:alnum:]' | cut -c1-30)
            curl --fail --retry 3 --retry-delay 1 -L \
              "https://www.google.com/search?q=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$query")" \
              -o "/tmp/google-$safe.html" || true
            curl --fail --retry 3 --retry-delay 1 -L \
              "https://www.bing.com/search?q=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$query")" \
              -o "/tmp/bing-$safe.html" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: studyclix-probe
          path: |
            /tmp/studyclix-papers.html
            /tmp/studyclix-endpoints.txt
            /tmp/studyclix-*.json
            /tmp/studyclix-page-*.html
            /tmp/google-*.html
            /tmp/bing-*.html
            /tmp/studyclix-js
