name: Probe StudyClix paper API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch papers page and scripts
        run: |
          mkdir -p /tmp/studyclix-js
          curl --fail --retry 3 --retry-delay 2 -L \
            https://www.studyclix.ie/papers -o /tmp/studyclix-papers.html
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/studyclix-papers.html |
            sed -E 's/^src="([^"]+)".*$/\1/' |
            while read -r script; do
              case "$script" in
                http*) url="$script" ;;
                /*) url="https://www.studyclix.ie$script" ;;
                *) url="https://www.studyclix.ie/$script" ;;
              esac
              curl --fail --retry 3 --retry-delay 1 -L "$url" \
                -o "/tmp/studyclix-js/$(basename "${script%%\?*}")" || true
            done
          grep -RohE 'https?[^"]+|/api/[A-Za-z0-9_/?=&.-]+' /tmp/studyclix-js |
            grep -Ei 'paper|exam|mark|api' | sort -u > /tmp/studyclix-endpoints.txt || true
          for endpoint in exams examYears mediaTypes subjects; do
            curl --retry 3 --retry-delay 1 -L \
              "https://bff.studyclix.ie/api/$endpoint" \
              -o "/tmp/studyclix-$endpoint.json" || true
          done
          curl --fail --retry 3 --retry-delay 1 -L \
            'https://bff.studyclix.ie/api/exampapers?subject=1' \
            -o /tmp/studyclix-exampapers-1.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: studyclix-probe
          path: |
            /tmp/studyclix-papers.html
            /tmp/studyclix-endpoints.txt
            /tmp/studyclix-*.json
            /tmp/studyclix-js
