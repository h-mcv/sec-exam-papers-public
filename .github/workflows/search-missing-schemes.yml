name: Search missing marking schemes

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search indexed CDN URLs
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import urllib.parse
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())
          papers = {}
          schemes = set()
          names = {}
          for x in manifest:
              key = (x["level"], x["subjectId"], x["year"])
              names[key] = x["subjectName"]
              if "marking-scheme" in x["file"]:
                  schemes.add(key)
              else:
                  papers.setdefault(key, []).append(x)

          root = Path("/tmp/found")
          root.mkdir()
          targets = [key for key in sorted(papers) if key not in schemes]

          def search(key):
              level, sid, year = key
              exam = "Junior Cycle" if level == "jc" else "Leaving Certificate"
              subject = names[key]
              query = f'site:blob-static.studyclix.ie/cms/media "{exam} {year} Marking Scheme" "{subject}"'
              url = "https://www.bing.com/search?" + urllib.parse.urlencode({"q": query, "count": 10})
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  data = urllib.request.urlopen(request, timeout=10).read().decode("utf-8", "ignore")
              except Exception:
                  return []
              data = html.unescape(data)
              urls = sorted(set(re.findall(r"https://blob-static\.studyclix\.ie/cms/media/[A-Za-z0-9-]+\.pdf", data)))
              if not urls:
                  return []
              safe = re.sub(r"[^a-z0-9]+", "-", f"{level}-{sid}-{year}".lower()).strip("-")
              found = []
              for n, pdf_url in enumerate(urls[:3]):
                  dest = root / safe / f"{n}.pdf"
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  try:
                      subprocess.run(["curl", "--fail", "--retry", "1", "--max-time", "15",
                                      "-L", pdf_url, "-o", str(dest)], check=True,
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  except Exception:
                      dest.unlink(missing_ok=True)
                      continue
                  if dest.read_bytes()[:5] == b"%PDF-":
                      found.append({"key": key, "url": pdf_url, "file": str(dest)})
              return found

          rows = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(search, key) for key in targets]
              for future in as_completed(futures):
                  rows.extend(future.result())
          (root / "results.json").write_text(json.dumps(rows, indent=2))
          print("found", len(rows), "candidate PDFs")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: missing-scheme-search
          path: /tmp/found
