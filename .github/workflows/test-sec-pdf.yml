name: Download LC marking schemes

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eux
          mkdir -p /tmp/schemes
          u='https://www.examinations.ie/archive/markingschemes/2025/LC025ALP000EV.pdf'
          curl --fail --location --max-time 60 "https://api.allorigins.win/raw?url=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=\"\"))' "$u")" -o /tmp/schemes/test.pdf
          file /tmp/schemes/test.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: lc-marking-schemes
          path: /tmp/schemes
