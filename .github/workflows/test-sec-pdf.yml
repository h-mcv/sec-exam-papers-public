name: Test SEC PDF access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eux
          git clone --depth 1 https://github.com/ETM-Code/exam-papers.git /tmp/exam-papers
          cd /tmp/exam-papers
          go run ./cmd/exam-papers list papers -y 2025 -e lc -s 25 --json | head -c 1000
