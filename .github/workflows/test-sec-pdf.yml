name: Download LC marking schemes

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eux
          mkdir -p /tmp/schemes
          u='https://www.examinations.ie/archive/markingschemes/2025/LC025ALP000EV.pdf'
          q="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=\"\"))' "$u")"
          curl --silent --show-error --location --max-time 60 "https://corsproxy.io/?url=$q" -o /tmp/schemes/corsproxy
          curl --silent --show-error --location --max-time 60 "https://api.codetabs.com/v1/proxy?quest=$q" -o /tmp/schemes/codetabs || true
          curl --silent --show-error --location --max-time 60 "https://cors.isomorphic-git.org/$u" -o /tmp/schemes/isomorphic || true
          curl --silent --show-error --location --max-time 60 "https://proxy.corsfix.com/?$u" -o /tmp/schemes/corsfix || true
          file /tmp/schemes/*
      - uses: actions/upload-artifact@v4
        with:
          name: lc-marking-schemes
          path: /tmp/schemes
